<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#16120e">
<meta property="og:type" content="website">
<meta property="og:title" content="وقار | Waqar Luxury Abayas">
<meta property="og:description" content="وقار - عبايات فاخرة جاهزة أو مفصّلة على مقاسك | Waqar - Luxury abayas, ready to wear or made to measure">
<meta property="og:locale" content="ar_EG">
<meta property="og:locale:alternate" content="en_US">
<title>وقار | عبايات فاخرة - Waqar Luxury Abayas</title>
<meta name="description" content="وقار - عبايات فاخرة جاهزة أو مفصّلة على مقاسك | Waqar - Luxury abayas, ready to wear or made to measure">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ebony:#16120e; --coal:#1f1a14; --coal-2:#2b251c;
  --gold:#c9a66b; --gold-lt:#e6d3a8; --gold-dk:#8a6a33;
  --ivory:#f5f0e7; --sand:#e9e0d0; --ink:#2a251d; --muted:#6f6454;
  --f-display-ar:"Aref Ruqaa","Tajawal",serif;
  --f-display-en:"Cormorant Garamond",Georgia,serif;
  --f-body-ar:"Tajawal","Jost",sans-serif;
  --f-body-en:"Jost","Tajawal",sans-serif;
}
html[lang="ar"]{--f-display:var(--f-display-ar);--f-body:var(--f-body-ar)}
html[lang="en"]{--f-display:var(--f-display-en);--f-body:var(--f-body-en)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--f-body);background:var(--ivory);color:var(--ink);line-height:1.7;font-size:17px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--ebony)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1240px,100%);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2}
html[lang="ar"] h1,html[lang="ar"] h2{line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.85em 1.9em;border:1px solid var(--gold);color:var(--gold-lt);letter-spacing:.02em;transition:background .25s,color .25s}
.btn:hover{background:var(--gold);color:var(--ebony)}
.btn.solid{background:var(--gold);color:var(--ebony)}
.btn.solid:hover{background:var(--gold-lt)}
.btn.dark{border-color:var(--ink);color:var(--ink)}
.btn.dark:hover{background:var(--ink);color:var(--ivory)}

/* announcement + header */
.announce{background:var(--gold);color:var(--ebony);font-size:.86rem;text-align:center;padding-block:.45em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.announce span+span{margin-inline-start:2.2em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ebony);border-bottom:1px solid rgba(201,166,107,.22)}
.bar{display:flex;align-items:center;justify-content:space-between;height:74px;gap:20px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--gold)}
.logo b{font-family:var(--f-display-ar);font-weight:400;font-size:2.1rem;line-height:1.1}
.logo small{font-family:var(--f-display-en);font-size:.58rem;letter-spacing:.34em;margin-top:2px;color:var(--gold-lt)}
.logo img{height:54px;width:auto}
.f-brand .logo img{height:66px}
nav.main{display:flex;gap:34px;color:var(--gold-lt);font-size:.98rem}
nav.main a{padding-block:6px;border-bottom:1px solid transparent;transition:border-color .2s}
nav.main a:hover{border-color:var(--gold)}
.tools{display:flex;align-items:center;gap:6px;color:var(--gold-lt)}
.tools button{padding:8px 12px;position:relative}
.lang{border:1px solid rgba(201,166,107,.5);font-size:.88rem;padding:6px 14px!important}
.lang:hover{background:var(--gold);color:var(--ebony)}
.cart-count{position:absolute;top:0;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--ebony);font-size:.72rem;line-height:18px;text-align:center;font-weight:500}
.burger{display:none}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}

/* hero */
.hero{background:var(--ebony);color:var(--gold-lt);position:relative;overflow:hidden;border-bottom:1px solid rgba(201,166,107,.2)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 72% 40%,rgba(201,166,107,.13),transparent 70%);pointer-events:none}
html[dir="rtl"] .hero::before{background:radial-gradient(60% 70% at 28% 40%,rgba(201,166,107,.13),transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px;min-height:min(86vh,760px);padding-block:60px;position:relative}
.hero h1{font-size:clamp(2.3rem,5vw,4rem);color:var(--ivory);margin-bottom:22px;max-width:14ch}
html[lang="en"] .hero h1{max-width:12ch;font-weight:500}
.hero p{max-width:44ch;color:#cdbfa5;font-size:1.08rem;margin-bottom:36px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.lockup{display:flex;flex-direction:column;align-items:center;color:var(--gold)}
.lockup img{width:min(340px,70vw);height:auto;animation:reveal 2.4s cubic-bezier(.5,.1,.2,1) backwards}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}}
@media (prefers-reduced-motion:reduce){.lockup img{animation:none}html{scroll-behavior:auto}}

/* sections */
section{padding-block:clamp(60px,9vw,110px)}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:38px}
.head h2{font-size:clamp(1.9rem,3.6vw,2.9rem)}
.head p{color:var(--muted);max-width:46ch}

/* categories */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cat{position:relative;aspect-ratio:4/5;overflow:hidden;color:var(--ivory);display:flex;align-items:end;text-align:start}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s}
.cat:hover img{transform:scale(1.04)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(22,18,14,.82),rgba(22,18,14,0) 55%)}
.cat div{position:relative;z-index:1;padding:26px}
.cat h3{font-size:1.9rem}
.cat span{font-size:.92rem;color:var(--gold-lt);border-bottom:1px solid var(--gold);padding-bottom:2px}

/* shop */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:.45em 1.3em;border:1px solid #cdbfa5;font-size:.94rem;transition:all .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
.card .ph{aspect-ratio:3/4;overflow:hidden;background:var(--coal);margin-bottom:14px}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card h3{font-family:var(--f-body);font-weight:500;font-size:1.04rem;line-height:1.5}
.card .price{color:var(--gold-dk);font-weight:500;margin-block:2px 12px}
.card .row{display:flex;gap:8px}
.card select{flex:0 0 auto;border:1px solid #cdbfa5;background:transparent;padding:.55em .7em;font:inherit;font-size:.9rem;color:var(--ink)}
.card .add{flex:1;border:1px solid var(--ink);padding:.55em 1em;font-size:.94rem;transition:all .2s}
.card .add:hover{background:var(--ink);color:var(--ivory)}
.edit-hint{margin-top:30px;font-size:.84rem;color:var(--muted)}

/* made to measure */
.mtm{background:var(--ebony);color:var(--gold-lt)}
.mtm-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(30px,6vw,80px);align-items:start}
.mtm h2{font-size:clamp(2rem,4vw,3.2rem);color:var(--ivory);margin-bottom:18px}
.mtm .lead{color:#cdbfa5;max-width:46ch;margin-bottom:34px}
.steps{list-style:none;border-top:1px solid rgba(201,166,107,.25)}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:18px 0;border-bottom:1px solid rgba(201,166,107,.25)}
.steps .n{font-family:var(--f-display-en);font-size:1.7rem;color:var(--gold);line-height:1.1}
.steps b{display:block;color:var(--ivory);font-weight:500}
.steps p{color:#b9ab91;font-size:.95rem}
.bulk{margin-top:30px;padding:20px 22px;border:1px solid var(--gold-dk);background:rgba(201,166,107,.06)}
.bulk b{display:block;color:var(--gold);font-weight:500;margin-bottom:2px}
.bulk p{color:#cdbfa5;font-size:.96rem}
form.mtm-form{background:var(--coal);border:1px solid rgba(201,166,107,.25);padding:clamp(22px,3.5vw,38px)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
label{display:block;font-size:.88rem;color:var(--gold-lt);margin-bottom:5px}
input,select.fld,textarea{width:100%;background:var(--ebony);border:1px solid rgba(201,166,107,.3);color:var(--ivory);padding:.7em .9em;font:inherit;font-size:.96rem;border-radius:0}
input:focus,select.fld:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
textarea{min-height:84px;resize:vertical}
fieldset{border:0;grid-column:1/-1}
legend{color:var(--gold);font-family:var(--f-display);font-size:1.25rem;margin-bottom:10px;padding:0}
.meas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-note{font-size:.84rem;color:#a89a80;margin-top:14px}
.err{color:#e9a38f;font-size:.88rem;margin-top:10px;min-height:1.3em}
form .btn{width:100%;margin-top:6px}

/* story */
.story-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(30px,6vw,80px);align-items:center}
.story-img{aspect-ratio:4/5;overflow:hidden;background:var(--coal)}
.story-img img{width:100%;height:100%;object-fit:cover}
.story h2{font-size:clamp(2rem,3.8vw,3rem);margin-bottom:18px}
.story p{color:#4a4236;max-width:52ch;margin-bottom:14px}

/* features */
.feats{background:var(--sand);padding-block:46px}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.feat b{display:block;font-weight:500;margin-bottom:2px}
.feat p{font-size:.92rem;color:var(--muted)}

/* footer */
footer{background:var(--ebony);color:#b9ab91;padding-block:60px 30px}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid rgba(201,166,107,.2)}
footer h4{font-family:var(--f-body);font-weight:500;color:var(--gold);margin-bottom:12px;font-size:1rem}
footer ul{list-style:none}
footer li{margin-bottom:7px}
footer a:hover{color:var(--gold-lt)}
.f-brand .logo{align-items:flex-start;margin-bottom:14px}
.f-brand p{max-width:34ch;font-size:.95rem}
.copy{padding-top:22px;font-size:.84rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* whatsapp float */
.wa{position:fixed;inset-block-end:calc(22px + env(safe-area-inset-bottom,0px));inset-inline-start:calc(22px + max(env(safe-area-inset-left,0px),env(safe-area-inset-right,0px)));z-index:30;width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--ebony);display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.wa svg{width:26px;height:26px;fill:currentColor}

/* cart drawer */
.veil{position:fixed;inset:0;background:rgba(10,8,6,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.veil.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--ivory);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s}
html[dir="rtl"] aside.drawer{transform:translateX(-105%)}
aside.drawer.on{transform:none!important}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 20px max(24px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--sand)}
.d-head h3{font-size:1.6rem}
.d-body{flex:1;overflow:auto;padding:8px max(24px,env(safe-area-inset-right,0px)) 8px max(24px,env(safe-area-inset-left,0px))}
.empty{padding:50px 0;text-align:center;color:var(--muted)}
.line{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--sand)}
.line img{width:70px;aspect-ratio:3/4;object-fit:cover}
.line h4{font-weight:500;font-size:.98rem;line-height:1.4}
.line small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:28px;height:28px;border:1px solid #cdbfa5}
.qty .rm{width:auto;border:0;margin-inline-start:auto;font-size:.84rem;color:var(--muted);text-decoration:underline}
.d-foot{padding:20px max(24px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));border-top:1px solid var(--sand);background:#fff}
.total{display:flex;justify-content:space-between;font-weight:500;margin-bottom:14px;font-size:1.1rem}
.d-foot .btn{width:100%;background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.d-foot .btn:hover{background:var(--gold-dk);border-color:var(--gold-dk)}
.d-foot .btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.toast{position:fixed;inset-block-end:calc(24px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--ivory);padding:.7em 1.4em;z-index:70;opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* single product */
.feature{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:start}
.gal,.info{min-width:0}
.main{aspect-ratio:3/4;max-height:86vh;overflow:hidden;background:var(--coal)}
.main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.th{aspect-ratio:3/4;overflow:hidden;border:1px solid transparent;opacity:.6;transition:opacity .2s,border-color .2s}
.th:hover{opacity:1}
.th[aria-pressed="true"]{opacity:1;border-color:var(--gold-dk)}
.th img{width:100%;height:100%;object-fit:cover}
.info h3{font-size:clamp(1.8rem,3.2vw,2.7rem);line-height:1.4;margin-bottom:6px}
.info .price{font-size:1.5rem;color:var(--gold-dk);font-weight:500;margin-bottom:18px}
.info .desc{color:#4a4236;max-width:46ch;margin-bottom:26px}
.info label{color:var(--ink);font-weight:500}
.info .row{display:flex;gap:8px;max-width:440px}
.info select{flex:0 0 auto;border:1px solid #cdbfa5;background:transparent;padding:.7em .8em;font:inherit;color:var(--ink)}
.info .add{flex:1;background:var(--ink);color:var(--ivory);padding:.8em 1.2em;transition:background .2s}
.info .add:hover{background:var(--gold-dk)}
.info .note{margin-top:12px;color:var(--muted);font-size:.92rem}
.info .alt{display:inline-block;margin-top:22px;border-bottom:1px solid var(--gold-dk);color:var(--ink)}

/* responsive */
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;text-align:center;min-height:auto}
  .hero h1,.hero p{margin-inline:auto}
  .hero .cta{justify-content:center}
  .lockup{order:-1}
  .grid{grid-template-columns:repeat(2,1fr)}
  .mtm-grid,.story-grid,.feature{grid-template-columns:1fr}
  .feat-grid{grid-template-columns:1fr 1fr}
  .f-grid{grid-template-columns:1fr 1fr}.f-brand{grid-column:1/-1}
  nav.main{position:absolute;top:100%;inset-inline:0;background:var(--ebony);flex-direction:column;gap:0;padding:6px 20px 16px;border-bottom:1px solid rgba(201,166,107,.22);display:none}
  nav.main.on{display:flex}
  nav.main a{padding:12px 0;border-bottom:1px solid rgba(201,166,107,.12)}
  .burger{display:block}
  .bar{position:relative}
}
@media (max-width:640px){
  body{font-size:16px}
  .cats{grid-template-columns:1fr}
  .cat{aspect-ratio:16/10}
  .grid{gap:22px 12px}
  .card .row{flex-direction:column}
  .fgrid,.meas{grid-template-columns:1fr 1fr}
  .announce span+span{display:none}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="announce"><span data-i18n="announce1"></span><span data-i18n="announce2"></span></div>

<header>
  <div class="wrap bar">
    <button class="burger tools" id="burger" aria-label="Menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
    <a href="#top" class="logo" id="logo" aria-label="Waqar"></a>
    <nav class="main" id="nav">
      <a href="#shop" data-i18n="nav_shop"></a>
      <a href="#custom" data-i18n="nav_custom"></a>
      <a href="#story" data-i18n="nav_story"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <div class="tools">
      <button class="lang" id="langBtn" type="button"></button>
      <button id="cartBtn" type="button" aria-label="Cart">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<main id="top">
<section class="hero" style="padding:0">
  <div class="wrap hero-grid">
    <div>
      <h1 data-i18n="hero_title"></h1>
      <p data-i18n="hero_sub"></p>
      <div class="cta">
        <a class="btn solid" href="#shop" data-i18n="hero_cta1"></a>
        <a class="btn" href="#custom" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <div class="lockup"><img id="heroLogo" alt="Waqar Luxury Abayas"></div>
  </div>
</section>

<section id="shop">
  <div class="wrap">
    <div class="head">
      <h2 data-i18n="shop_title"></h2>
      <div class="chips" id="chips" role="group"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="mtm" id="custom">
  <div class="wrap mtm-grid">
    <div>
      <h2 data-i18n="mtm_title"></h2>
      <p class="lead" data-i18n="mtm_lead"></p>
      <ol class="steps">
        <li><span class="n">1</span><div><b data-i18n="s1t"></b><p data-i18n="s1d"></p></div></li>
        <li><span class="n">2</span><div><b data-i18n="s2t"></b><p data-i18n="s2d"></p></div></li>
        <li><span class="n">3</span><div><b data-i18n="s3t"></b><p data-i18n="s3d"></p></div></li>
        <li><span class="n">4</span><div><b data-i18n="s4t"></b><p data-i18n="s4d"></p></div></li>
      </ol>
      <div class="bulk"><b data-i18n="bulk_t"></b><p data-i18n="bulk_d"></p></div>
    </div>

    <form class="mtm-form" id="mtmForm" novalidate>
      <div class="fgrid">
        <div class="full"><label for="f_name" data-i18n="f_name"></label><input id="f_name" autocomplete="name"></div>
        <div><label for="f_style" data-i18n="f_style"></label><select class="fld" id="f_style"></select></div>
        <div><label for="f_fabric" data-i18n="f_fabric"></label><select class="fld" id="f_fabric"></select></div>
        <div><label for="f_color" data-i18n="f_color"></label><select class="fld" id="f_color"></select></div>
        <div><label for="f_qty" data-i18n="f_qty"></label><input id="f_qty" type="number" min="1" max="500" value="1" inputmode="numeric"></div>
        <fieldset>
          <legend data-i18n="f_meas"></legend>
          <div class="meas">

const OPTIONS = {
 style:[["classic","كلاسيك مغلقة","Classic closed"],["open","مفتوحة من الأمام","Open front"],["wide","بكم واسع","Wide sleeves"],["embellished","مطرزة للمناسبات","Embellished occasion"],["set","طقم سهرة","Evening set"],["other","موديل آخر (اذكريه في الملاحظات)","Other (mention in notes)"]],
 fabric:[["crepe","كريب","Crepe"],["nida","نيدا","Nida"],["chiffon","شيفون","Chiffon"],["velvet","مخمل","Velvet"],["linen","كتان","Linen"],["other","أخرى","Other"]],
 color:[["black","أسود","Black"],["navy","كحلي","Navy"],["taupe","بيج داكن","Taupe"],["burgundy","عنابي","Burgundy"],["olive","زيتي","Olive"],["other","لون آخر","Other"]]
};

/* =====================================================================
   الكود / Code
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

let lang = "ar", filter = "all", cart = [];
try { const l = localStorage.getItem("waqar_lang"); if (l === "ar" || l === "en") lang = l; } catch(e){}
try { const c = JSON.parse(localStorage.getItem("waqar_cart") || "[]"); if (Array.isArray(c)) cart = c.filter(i => PRODUCTS.some(p => p.id === i.id) && i.qty > 0); } catch(e){}

const t = k => (T[lang][k] ?? k);
const fmt = n => n.toLocaleString(lang === "ar" ? "ar-EG" : "en-US");
const money = n => lang === "ar" ? `${fmt(n)} ${CONFIG.currency.ar}` : `${CONFIG.currency.en} ${fmt(n)}`;
const moneyMsg = n => `${n.toLocaleString("en-US")} ${CONFIG.currency[lang]}`;
const pname = p => p[lang];

/* صورة مؤقتة: عباية بخط ذهبي على خلفية داكنة */
const TONES = [["#2a241b","#16120e"],["#3a3126","#1c1712"],["#2b2a24","#14130f"],["#33291f","#17120d"],["#26231d","#12100c"],["#3b3228","#1d1812"],["#2d261c","#15110c"],["#30281f","#171310"]];
function placeholder(i){
  const [a,b] = TONES[i % TONES.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 400'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='300' height='400' fill='url(#g)'/><g fill='none' stroke='#c9a66b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' opacity='.85' transform='translate(60 40) scale(.8)'><path d='M90 18C72 18 66 36 69 54C72 70 108 70 111 54C114 36 108 18 90 18Z'/><path d='M69 62C52 68 46 88 43 118L14 300C55 316 125 316 166 300L137 118C134 88 128 68 111 62'/><path d='M90 70L90 308'/><path d='M43 118C30 165 26 215 30 250'/><path d='M137 118C150 165 154 215 150 250'/><path d='M66 140C60 200 52 255 46 306'/><path d='M114 140C120 200 128 255 134 306'/></g></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const pimg = p => imgs(p)[0];

function logoHTML(){
  return CONFIG.logoSrc
    ? `<img src="${CONFIG.logoSrc}" alt="Waqar">`
    : `<b>وقار</b><small>LUXURY ABAYAS</small>`;
}

/* ----- apply language ----- */
function applyLang(){
  const html = document.documentElement;
  html.lang = lang; html.dir = lang === "ar" ? "rtl" : "ltr";
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("#langBtn").textContent = t("lang_btn");
  $("#logo").innerHTML = logoHTML(); $("#logoFoot").innerHTML = logoHTML();
  fillSelect("f_style","style"); fillSelect("f_fabric","fabric"); fillSelect("f_color","color"); updateMtm();
  renderChips(); renderGrid(); renderCart();
  const wa = waURL(t("wa_hello"));
  $("#waLink").href = wa; $("#waFloat").href = wa; $("#igLink").href = CONFIG.instagram;
  $("#storyImg").src = CONFIG.storyImage || placeholder(2);
  $("#heroLogo").src = IMG.logo_hero;
  try { localStorage.setItem("waqar_lang", lang); } catch(e){}
}
function fillSelect(id, key){
  const el = $("#"+id), cur = el.value;
  el.innerHTML = OPTIONS[key].map(o => `<option value="${o[0]}">${lang==="ar"?o[1]:o[2]}</option>`).join("");
  if (cur) el.value = cur;
}
const waURL = text => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(text)}`;

/* ----- categories + filters ----- */
const CATS = ["ready","occasion","evening"];
function renderCats(){
  $("#cats").innerHTML = CATS.map((c,i) => `
    <a class="cat" href="#shop" data-cat="${c}">
      <img src="${CAT_IMAGES[c] || placeholder(i*2+1)}" alt="">
      <div><h3>${t("cat_"+c)}</h3><span>${t("cat_go")}</span></div>
    </a>`).join("");
}
function renderChips(){
  $("#chips").hidden = PRODUCTS.length < 4;
  if (PRODUCTS.length < 4) return;
  const items = [["all", t("f_all")], ...CATS.map(c => [c, t("cat_"+c)])];
  $("#chips").innerHTML = items.map(([k,l]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
}
const imgs = p => (p.images && p.images.length) ? p.images : [p.image || placeholder(PRODUCTS.indexOf(p))];
const pdesc = p => p[lang + "_d"] || "";
const sizeSelect = p => `<select id="sz_${p.id}" aria-label="${t("size")}" data-size="${p.id}">${SIZES.map(s => `<option>${s}</option>`).join("")}</select>`;
function card(p){
  return `
    <article class="card">
      <div class="ph"><img src="${imgs(p)[0]}" alt="${pname(p)}" loading="lazy"></div>
      <h3>${pname(p)}</h3>
      <div class="price">${money(p.price)}</div>
      <div class="row">${sizeSelect(p)}<button class="add" type="button" data-add="${p.id}">${t("add")}</button></div>
    </article>`;
}
function featured(p){
  const im = imgs(p);
  return `
    <article class="feature">
      <div class="gal">
        <div class="main"><img id="mainImg" src="${im[0]}" alt="${pname(p)}"></div>
        <div class="thumbs">${im.map((src,i) => `<button type="button" class="th" data-th="${i}" data-pid="${p.id}" aria-pressed="${i===0}" aria-label="${pname(p)} ${i+1}"><img src="${src}" alt=""></button>`).join("")}</div>
      </div>
      <div class="info">
        <h3>${pname(p)}</h3>
        <div class="price">${money(p.price)}</div>
        <p class="desc">${pdesc(p)}</p>
        <label for="sz_${p.id}">${t("size")}</label>
        <div class="row">${sizeSelect(p)}<button class="add" type="button" data-add="${p.id}">${t("add")}</button></div>
        <p class="note">${t("all_sizes")}</p>
        <a class="alt" href="#custom">${t("hero_cta2")}</a>
      </div>
    </article>`;
}
function renderGrid(){
  const list = PRODUCTS.filter(p => filter === "all" || p.cat === filter);
  const grid = $("#grid");
  grid.classList.toggle("single", list.length === 1);
  grid.innerHTML = list.length === 1 ? featured(list[0]) : list.map(card).join("");
}

/* ----- cart ----- */
function saveCart(){ try { localStorage.setItem("waqar_cart", JSON.stringify(cart)); } catch(e){} }
function cartTotal(){ return cart.reduce((s,i) => s + PRODUCTS.find(p => p.id === i.id).price * i.qty, 0); }
function renderCart(){
  const n = cart.reduce((s,i) => s + i.qty, 0);
  $("#cartCount").textContent = fmt(n);
  $("#cartTotal").textContent = money(cartTotal());
  $("#checkout").setAttribute("aria-disabled", String(!cart.length));
  $("#checkout").href = cart.length ? checkoutURL() : "#";
  $("#cartBody").innerHTML = cart.length ? cart.map((i,idx) => {
    const p = PRODUCTS.find(x => x.id === i.id);
    return `<div class="line">
      <img src="${pimg(p)}" alt="">
      <div><h4>${pname(p)}</h4><small>${t("size")} ${i.size} - ${money(p.price)}</small>
        <div class="qty">
          <button type="button" data-q="-1" data-i="${idx}" aria-label="-">-</button>
          <span>${fmt(i.qty)}</span>
          <button type="button" data-q="1" data-i="${idx}" aria-label="+">+</button>
          <button type="button" class="rm" data-rm="${idx}">${t("remove")}</button>
        </div></div></div>`;
  }).join("") : `<p class="empty">${t("cart_empty")}</p>`;
}
function addToCart(id){
  const size = $(`[data-size="${id}"]`).value;
  const ex = cart.find(i => i.id === id && i.size === size);
  if (ex) ex.qty++; else cart.push({id, size, qty:1});
  saveCart(); renderCart(); toast(t("added"));
}
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800);
}
function openCart(open){
  $("#drawer").classList.toggle("on", open); $("#veil").classList.toggle("on", open);
  $("#drawer").setAttribute("aria-hidden", String(!open));
  if (open) $("#closeCart").focus();
}
function checkoutURL(){
  const lines = cart.map(i => {
    const p = PRODUCTS.find(x => x.id === i.id);
    return `- ${pname(p)} | ${t("size")}: ${i.size} | x${i.qty} | ${moneyMsg(p.price * i.qty)}`;
  });
  return waURL([t("wa_greet"), ...lines, "", `${t("wa_total")}: ${moneyMsg(cartTotal())}`].join("\n"));
}

/* ----- made to measure form ----- */
function optLabel(key, val){ const o = OPTIONS[key].find(x => x[0] === val); return o ? (lang === "ar" ? o[1] : o[2]) : val; }
function mtmData(){
  const name = $("#f_name").value.trim(), qty = parseInt($("#f_qty").value, 10);
  const m = ["m_len","m_sh","m_sl","m_bu","m_wa","m_hi"]
    .map(id => $("#"+id).value ? `${t(id)}: ${$("#"+id).value}` : "").filter(Boolean).join(" | ");
  const note = $("#f_note").value.trim();
  const msg = [
    t("wa_custom"),
    `${t("wa_name")}: ${name}`,
    `${t("wa_style")}: ${optLabel("style", $("#f_style").value)}`,
    `${t("wa_fabric")}: ${optLabel("fabric", $("#f_fabric").value)}`,
    `${t("wa_color")}: ${optLabel("color", $("#f_color").value)}`,
    `${t("wa_qty")}: ${qty || ""}`,
    m ? `${t("wa_meas")}: ${m}` : "",
    note ? `${t("wa_note")}: ${note}` : ""
  ].filter(Boolean).join("\n");
  return { name, qty, msg };
}
function updateMtm(){ $("#mtmSend").href = waURL(mtmData().msg); }
$("#mtmSend").addEventListener("click", e => {
  const d = mtmData(), err = $("#mtmErr"); err.textContent = "";
  if (!d.name){ e.preventDefault(); err.textContent = t("err_name"); $("#f_name").focus(); return; }
  if (!d.qty || d.qty < 1){ e.preventDefault(); err.textContent = t("err_qty"); $("#f_qty").focus(); return; }
  updateMtm();
});
$("#mtmForm").addEventListener("submit", e => e.preventDefault());
$("#mtmForm").addEventListener("input", updateMtm);
$("#mtmForm").addEventListener("change", updateMtm);

/* ----- events ----- */
document.addEventListener("click", e => {
  const th = e.target.closest("[data-th]");
  if (th){ const p = PRODUCTS.find(x => x.id === th.dataset.pid); $("#mainImg").src = imgs(p)[+th.dataset.th]; $$(".th").forEach(b => b.setAttribute("aria-pressed", String(b === th))); return; }
  const a = e.target.closest("[data-add]"); if (a) return addToCart(a.dataset.add);
  const f = e.target.closest("[data-f]"); if (f){ filter = f.dataset.f; renderChips(); renderGrid(); return; }
  const c = e.target.closest("[data-cat]"); if (c){ filter = c.dataset.cat; renderChips(); renderGrid(); return; }
  const q = e.target.closest("[data-q]");
  if (q){ const it = cart[+q.dataset.i]; it.qty += +q.dataset.q; if (it.qty < 1) cart.splice(+q.dataset.i, 1); saveCart(); renderCart(); return; }
  const rm = e.target.closest("[data-rm]"); if (rm){ cart.splice(+rm.dataset.rm, 1); saveCart(); renderCart(); return; }
  if (e.target.closest("#nav a")) closeMenu();
});
$("#langBtn").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; applyLang(); });
$("#cartBtn").addEventListener("click", () => openCart(true));
$("#closeCart").addEventListener("click", () => openCart(false));
$("#veil").addEventListener("click", () => openCart(false));
$("#checkout").addEventListener("click", e => { if (!cart.length) e.preventDefault(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ openCart(false); closeMenu(); } });
function closeMenu(){ $("#nav").classList.remove("on"); $("#burger").setAttribute("aria-expanded","false"); }
$("#burger").addEventListener("click", () => {
  const on = $("#nav").classList.toggle("on"); $("#burger").setAttribute("aria-expanded", String(on));
});

applyLang();
</script>

</body>
</html>
